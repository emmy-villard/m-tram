services:

  db:
    image: postgres:16-alpine
    restart: always
    # set shared memory limit
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
        - ../sql/init.sql:/docker-entrypoint-initdb.d/init.sql
x-airflow-common:
  &airflow-common
  build:
    context: .
    target: airflow
  image: ${AIRFLOW_IMAGE_NAME}
  networks:
    - airflow_net
  env_file:
    - ${ENV_FILE_PATH}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
    DATABASE__SQL_ALCHEMY_CONN: ${DATABASE__SQL_ALCHEMY_CONN}
    AIRFLOW__CELERY__RESULT_BACKEND: ${AIRFLOW__CELERY__RESULT_BACKEND}
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    BASE_URL: ${APISERVER_URL}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: '${APISERVER_URL}/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
  volumes:
    - ${AIRFLOW_PROJ_DIR}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR}/plugins:/opt/airflow/plugins
  user: ${AIRFLOW_UID}
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    airflow_metadata_db:
      condition: service_healthy

services:
  streamlit-dashboard:
    networks:
      - proxy_net
    ports:
      - ${DASHBOARD_DEV_PORT}:80
    environment:
      <<: *airflow-common-env
      VIRTUAL_HOST: ${DASHBOARD_PROD_URL}
      VIRTUAL_PORT: 80
      ACME_HOST: ${DASHBOARD_PROD_URL}
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: 80
    env_file:
      - ${ENV_FILE_PATH}
    build:
      context: .
      target: streamlit-dashboard
    image: ${DASHBOARD_IMAGE}
    command: streamlit run main.py

networks:
  proxy_net:
    name: proxy_net
    external: ${PROXY_NET_EXTERNAL}
  airflow_net:
    name: airflow_net
    external: false

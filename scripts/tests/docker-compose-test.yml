services:
  test_db:
    image: postgres:18-alpine
    restart: always
    # set shared memory limit
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD}
      POSTGRES_USER: ${POSTGRES_TEST_USER}
      POSTGRES_DB: ${POSTGRES_TEST_DB}
    ports:
      - ${POSTGRES_TEST_PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "postgres"]
      start_period: 2s
      interval: 0.5s
      retries: 20
      timeout: 10s

  fastapi-server:
    image: fastapi_test
    build:
      context: ../..
      target: fastapi
    environment:
      DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_TEST_USER}:${POSTGRES_TEST_PASSWORD}@test_db:5432/${POSTGRES_TEST_DB}
    depends_on:
      test_db:
        condition: service_healthy
    ports:
      - 8081:80